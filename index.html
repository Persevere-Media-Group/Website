<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-K9CF4P4X");
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Static fallback head content: this is the only HTML any crawler that
         doesn't execute JavaScript (most social link-preview scrapers) ever
         sees, on every route, since this is a client-rendered SPA served as
         one static file. Each tag is marked data-default so main.tsx can
         strip it the moment React boots, before src/seo/Seo.tsx renders the
         real per-route tags - otherwise React 19's head-hoisting only adds
         its own tags alongside these static ones (it doesn't know to replace
         markup it didn't render), leaving duplicate title/description/
         canonical tags for crawlers that do run JS. -->
    <title data-default>Persevere Media | Content & Paid Ads, Done Properly</title>
    <meta
      data-default
      name="description"
      content="Persevere Media is a two-person growth partner combining paid ads and content creation under one roof. £20m+ in ad spend managed across 50+ brands — no account managers, no bloated fees."
    />
    <link data-default rel="canonical" href="https://choosepersevere.com/" />
    <meta
      data-default
      property="og:title"
      content="Persevere Media | Content & Paid Ads, Done Properly"
    />
    <meta
      data-default
      property="og:description"
      content="Persevere Media is a two-person growth partner combining paid ads and content creation under one roof. £20m+ in ad spend managed across 50+ brands — no account managers, no bloated fees."
    />
    <meta data-default property="og:url" content="https://choosepersevere.com/" />
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:image" content="https://choosepersevere.com/og-image.png" />
    <meta data-default property="og:site_name" content="Persevere Media" />
    <meta data-default name="twitter:card" content="summary_large_image" />
    <meta
      data-default
      name="twitter:title"
      content="Persevere Media | Content & Paid Ads, Done Properly"
    />
    <meta
      data-default
      name="twitter:description"
      content="Persevere Media is a two-person growth partner combining paid ads and content creation under one roof. £20m+ in ad spend managed across 50+ brands — no account managers, no bloated fees."
    />
    <meta data-default name="twitter:image" content="https://choosepersevere.com/og-image.png" />

    <!-- Iona's "ik" wordmark (font-face + .ik-logo styling), used by MadeByBadge -->
    <link rel="stylesheet" href="/logos/ionakate.css" />

    <!-- Google Consent Mode: sets analytics/ad storage to denied by default, BEFORE
         gtag.js even loads. gtag respects this internally, so no analytics data is
         actually sent until the cookie banner calls gtag('consent','update', ...)
         with 'granted'. This must come before the gtag.js script tag below. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4TYGQEZE43"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-4TYGQEZE43");
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "1541019407776705");
      fbq("consent", "revoke");
      fbq("track", "PageView");
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-K9CF4P4X"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Meta Pixel <noscript> fallback. Must live in <body>: inside <head>, a
         <noscript> may only contain <link>, <style> and <meta>, so an <img>
         there is disallowed content and fails HTML parsing. -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1541019407776705&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
