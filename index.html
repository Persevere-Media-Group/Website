<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Persevere - Coming Soon</title>

    <!-- Iona's "ik" wordmark (font-face + .ik-logo styling), used by MadeByBadge -->
    <link rel="stylesheet" href="/logos/ionakate.css" />

    <!-- Google Consent Mode: sets analytics/ad storage to denied by default, BEFORE
         gtag.js even loads. gtag respects this internally, so no analytics data is
         actually sent until the cookie banner calls gtag('consent','update', ...)
         with 'granted'. This must come before the gtag.js script tag below. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
      });
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4TYGQEZE43"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-4TYGQEZE43");
    </script>

    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "1541019407776705");
      fbq("consent", "revoke");
      fbq("track", "PageView");
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Meta Pixel <noscript> fallback. Must live in <body>: inside <head>, a
         <noscript> may only contain <link>, <style> and <meta>, so an <img>
         there is disallowed content and fails HTML parsing. -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1541019407776705&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
