backend:
  name: github
  repo: Persevere-Media-Group/Website
  branch: main
  base_url: https://REPLACE_ME_WITH_YOUR_OAUTH_PROXY_URL.vercel.app
  auth_endpoint: auth # confirm this against whichever OAuth proxy README you deploy

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
